<svg width="269" height="56" viewBox="0 0 269 56" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Golden Badge Gradient matching official Trength brand -->
        <linearGradient id="gold_badge_grad" x1="4" y1="4" x2="52" y2="52" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#F7BC18"/>
            <stop offset="50%" stop-color="#F2B007"/>
            <stop offset="100%" stop-color="#E19900"/>
        </linearGradient>
        <!-- Soft Golden Glow Shadow -->
        <filter id="badge_soft_shadow" x="0" y="2" width="56" height="56" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D99000" flood-opacity="0.3"/>
        </filter>
        <linearGradient id="gold_accent" x1="68" y1="46" x2="116" y2="46" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#F7BC18"/>
            <stop offset="100%" stop-color="#E19900"/>
        </linearGradient>
    </defs>

    <!-- OFFICIAL TREGNTH BADGE: Golden Rounded Tile with Devanagari 'त्र' -->
